<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1424" />
    <meta
      name="description"
      content="Kynex — استوديو رقمي متخصص في تصميم وتطوير مواقع وهويات رقمية دقيقة التفاصيل. Kynex — a digital studio crafting precise, considered websites and digital identities."
    />
    <title>Kynex — Digital Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=El+Messiri:wght@500;600;700&family=Cairo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Runs before paint to avoid a language/direction flash.
      (function () {
        try {
          var lang = localStorage.getItem('kynex-lang') || 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
